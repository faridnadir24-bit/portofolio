    <!-- ====== COMPREHENSIVE CLIENT-SIDE SECURITY HARDENING v3 ====== -->
    <script>
      // 1. Anti-Clickjacking & Anti-Framing (Framebusting)
      try {
        if (window.top !== window.self) {
          window.top.location = window.self.location;
        }
      } catch (e) {
        document.documentElement.style.display = 'none';
        document.body.innerHTML = '';
      }

      // 2. Anti-Right-Click Source Inspection
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

      // 3. Anti-Drag (prevent image/text dragging for scraping)
      document.addEventListener('dragstart', function(e) { e.preventDefault(); });

      // 4. Anti-Copy/Cut/Paste on document level
      ['copy', 'cut'].forEach(function(ev) {
        document.addEventListener(ev, function(e) { e.preventDefault(); });
      });

      // 5. Anti-Text-Selection CSS injection (deterrent only)
      var _nss = document.createElement('style');
      _nss.textContent = 'img, video { pointer-events: none; -webkit-user-select: none; user-select: none; }';
      document.head.appendChild(_nss);

      // 6. Disable common DevTools keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12') { e.preventDefault(); }
        // Ctrl+Shift+I/J/C (Inspector/Console/Element Picker)
        if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); }
        // Ctrl+U (View Source)
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); }
        // Ctrl+S (Save Page)
        if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); }
        // Ctrl+P (Print — prevents easy PDF save of page)
        if (e.ctrlKey && (e.key === 'p' || e.key === 'P') && !e.shiftKey) { e.preventDefault(); }
        // Ctrl+A (Select All — discourages bulk copy)
        if (e.ctrlKey && (e.key === 'a' || e.key === 'A') && !e.shiftKey) { e.preventDefault(); }
        // PrintScreen key
        if (e.key === 'PrintScreen') {
          navigator.clipboard.writeText('').catch(function(){});
        }
      });

      // 7. Clear window.name to prevent data leakage across sites
      window.name = '';

      // 8. Console Warning Banner (social engineering deterrent)
      console.log(
        '%c⚠️ PERINGATAN KEAMANAN',
        'color:#EF4444;font-size:28px;font-weight:900;text-shadow:1px 1px 0 #000;'
      );
      console.log(
        '%cIni adalah fitur browser untuk developer. Jika seseorang menyuruh Anda menyalin-tempel sesuatu di sini, itu adalah penipuan.',
        'color:#F59E0B;font-size:14px;'
      );
      console.log(
        '%c🔒 Situs ini dilindungi oleh CSP, HSTS Preload, COEP, COOP, Trusted Types, dan 40+ API Permissions-Policy blocks.',
        'color:#10B981;font-size:12px;'
      );

      // 9. DevTools detection (timing heuristic + property getter trap)
      (function() {
        var _dc = 0;
        // Method A: debugger timing
        setInterval(function() {
          var s = performance.now();
          debugger; // eslint-disable-line no-debugger
          if (performance.now() - s > 100) {
            _dc++;
            if (_dc > 2) {
              document.title = '⚠️ DevTools Detected — Farid Nadir Portfolio';
            }
          }
        }, 3000);

        // Method B: console.log property getter (fires only when DevTools console is open)
        var _devImg = new Image();
        Object.defineProperty(_devImg, 'id', {
          get: function() {
            _dc += 3;
            document.title = '⚠️ DevTools Detected — Farid Nadir Portfolio';
          }
        });
        setInterval(function() { console.debug('%c', _devImg); }, 5000);
      })();

      // 10. Block external script injection via MutationObserver
      (function() {
        var _allowed = ['portofolio-gvgr.vercel.app', 'fonts.googleapis.com', 'fonts.gstatic.com'];
        var obs = new MutationObserver(function(mutations) {
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (node.tagName === 'SCRIPT' && node.src) {
                try {
                  var u = new URL(node.src);
                  var ok = _allowed.some(function(d) { return u.hostname === d || u.hostname.endsWith('.' + d); });
                  if (!ok && u.hostname !== location.hostname) {
                    node.remove();
                  }
                } catch(e) { node.remove(); }
              }
            });
          });
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();

      // 11. Disable eval and Function constructor (additional XSS prevention)
      try {
        window.eval = function() { throw new Error('eval() is disabled for security.'); };
      } catch(e) {}
    </script>
